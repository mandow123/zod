# Install this file only inside the existing cloudpay.kai.com HTTP :8081 origin
# server block on 18.163.148.84 (TLS terminates upstream). It contains no default
# route, /api route or cloud.kai.com route.

location = /mobile/v1 {
    set_real_ip_from 172.31.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    proxy_pass http://172.31.31.78:4154;
    proxy_http_version 1.1;
    proxy_set_header Host cloudpay.kai.com;
    proxy_set_header X-Forwarded-Host cloudpay.kai.com;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Connection "";
    proxy_redirect off;
    add_header Cache-Control "no-store" always;
}

location = /mobile/v1/credits/topups/qixiang/notify {
    # The provider signs GET parameters. The edge must not persist them.
    access_log off;
    set_real_ip_from 172.31.0.0/16;
