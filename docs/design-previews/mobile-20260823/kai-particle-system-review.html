      workspace:{title:'卖家工作台',html:'<article class="scene-card workspace-hero"><span class="chip"><i class="dot"></i>资源状态</span><h3>把可用算力，交给正在等它的人</h3><p class="tiny">审核、接单、交付在这里衔接。</p><div class="progress"><i></i></div></article><div class="workspace-list"><article class="scene-card"><div class="row"><b>接单与交付</b><span class="tiny">登录后查看</span></div></article><article class="scene-card"><div class="row"><b>资源管理</b><button class="cta ghost" data-ripple>查看资源</button></div></article></div><nav class="bottom-nav"><b>工作台</b><span>资源</span><span>上架</span><span>消息</span><span>我的</span></nav>'},
      listing:{title:'上架算力',html:'<div class="steps"><i class="step is-on"></i><i class="step is-on"></i><i class="step"></i></div><article class="scene-card listing-form"><b>填写基础信息</b><div class="field"><label>资源类型</label><div class="fake-input">选择 GPU 或设备</div></div><div class="field"><label>可用时间</label><div class="fake-input">选择可交付时段</div></div><button class="cta" style="margin-top:15px" data-ripple>继续填写</button></article><article class="scene-card" style="padding:14px;margin-top:11px"><b>准备核验材料</b><p class="tiny">清单完整后，再发布给需要的人。</p></article><nav class="bottom-nav"><span>工作台</span><span>资源</span><b>上架</b><span>消息</span><span>我的</span></nav>'},
      profile:{title:'我的',html:'<article class="scene-card profile-top"><div class="row"><div class="row"><div class="avatar">Z</div><div><b>你好，欢迎回来</b><p class="tiny">登录后查看账户与资产</p></div></div><span>›</span></div></article><div class="scene-card profile-list"><button data-ripple><span>我是买家</span><span>›</span></button><button data-ripple><span>我要找算力</span><span>›</span></button><button data-ripple><span>我是卖家</span><span>›</span></button><button data-ripple><span>我要卖算力</span><span>›</span></button></div><nav class="bottom-nav"><span>首页</span><span>市场</span><span>订单</span><span>消息</span><b>我的</b></nav>'}
    };
    var sceneNav=[['home','首页'],['market','市场'],['workspace','工作台'],['listing','上架'],['profile','我的']];
    var networkCopy={
      sequence:{tag:'串联入场',title:'算力不闲置，创造不等待',desc:'让每一份算力，去往需要之处。',line:'COMPUTE IN MOTION · Zod',buttons:[]},
      loss:{tag:'连接断开',title:'连接中断了',desc:'当前网络不稳定，稍后可以重新尝试。',line:'连接已断开',buttons:['重新连接','先回首页']},
      reconnecting:{tag:'正在重连',title:'KAI 正在重新连接',desc:'正在确认刚才的操作结果，请稍等。',line:'连接正在恢复',buttons:[]},
      restored:{tag:'连接恢复',title:'连接恢复了',desc:'刚才的操作结果已经更新，确认后再继续。',line:'网络连接正常',buttons:['查看操作结果']},
      failed:{tag:'连接失败',title:'KAI 还差一段连接',desc:'可以再试一次，或稍后继续。',line:'线路未连通',buttons:['再试一次','先回首页']}
    };
    var emotions={sequence:['happy','happy','happy'],loss:['angry','sad','sad'],reconnecting:['angry','angry','angry'],restored:['joyful','joyful','joyful'],failed:['sad','sad','sad']};
    function current(){var r={};Object.keys(selects).forEach(function(k){r[k]=selects[k].value});return r}
    function normalize(raw){var v={};Object.keys(defaults).forEach(function(k){v[k]=valid[k].indexOf(raw[k])>-1?raw[k]:defaults[k]});return v}
    function applyTheme(v){var resolved=v.theme==='system'?(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):v.theme;root.dataset.theme=resolved;root.dataset.palette=v.palette;var meta=document.querySelector('meta[name="theme-color"]');if(meta)meta.content=getComputedStyle(root).getPropertyValue('--paper').trim()}
    function clearTimers(){timers.forEach(function(id){clearTimeout(id);clearInterval(id)});timers=[]}
    function clearParticles(){clearTimers();rippleQueue=[];ambient.querySelectorAll('.particle,.route-line').forEach(function(n){n.remove()})}
    function el(cls,index,left,top){var n=document.createElement('i');n.className=cls;n.dataset.particleMode=state.effective;n.dataset.particleIndex=String(index);if(left!==undefined)n.style.left=left;if(top!==undefined)n.style.top=top;ambient.appendChild(n);return n}
    function line(left,top,width,rotate){var n=document.createElement('i');n.className='route-line';n.style.left=left;n.style.top=top;n.style.width=width;n.style.transform='rotate('+rotate+'deg)';ambient.appendChild(n)}
    function renderParticles(){clearParticles();if(state.effective==='off')return;var m=state.effective;if(m==='routes'){line('7%','42%','83%','-5');line('9%','62%','76%','-12');for(var i=0;i<4;i++){var p=el('particle packet',i,(6+i*8)+'%',(42+(i%2)*20)+'%');p.style.animationDelay=(-i*2.1)+'s'}}
      else if(m==='mist'){for(var a=0;a<3;a++){var q=el('particle mist',a,(8+a*28)+'%',(10+(a%2)*31)+'%');q.style.animationDelay=(-a*4.2)+'s'}}
      else if(m==='nodes'){line('15%','65%','46%','-24');line('35%','43%','46%','11');var spots=[['17%','24%'],['72%','22%'],['35%','44%'],['80%','52%'],['13%','67%'],['59%','72%']];spots.forEach(function(s,i){el('particle node',i,s[0],s[1])});var sig=el('particle node-signal',6,'16%','66%');sig.style.animationDelay='-1.1s'}
      else if(m==='streams'){for(var b=0;b<2;b++){var st=el('particle stream',b,(4+b*37)+'%',(25+b*36)+'%');st.style.animationDelay=(-b*3.8)+'s'}}
      else if(m==='contours'){for(var c=0;c<3;c++){var ct=el('particle contour',c,(-8+c*19)+'%',(18+c*21)+'%');ct.style.animationDelay=(-c*4.6)+'s'}}
      else if(m==='weave'){for(var d=0;d<4;d++){var w=el('particle weave-line',d,(2+d%2*11)+'%',(27+d*12)+'%');w.style.transform='rotate('+(d%2?9:-9)+'deg)';w.style.animationDelay=(-d*1.7)+'s'}var wn=el('particle weave-node',4,'17%','43%');wn.style.animationDelay='-2.5s'}
      else if(m==='beacons'){for(var e=0;e<2;e++){var bc=el('particle beacon',e,(23+e*47)+'%',(31+e*30)+'%');bc.style.animationDelay=(-e*4)+'s'}}
    }
    function triggerRipple(target){if(state.effective!=='ripple'||state.motion==='reduced'||document.hidden)return;while(rippleQueue.length>=2){var old=rippleQueue.shift();if(old.node.parentNode)old.node.remove();clearTimeout(old.timer)}var rect=ambient.getBoundingClientRect(), point=target.getBoundingClientRect(), r=el('particle ripple',rippleSequence++,Math.max(0,point.left-rect.left+point.width/2-17)+'px',Math.max(0,point.top-rect.top+point.height/2-17)+'px'), ref={node:r,timer:null};ref.timer=setTimeout(function(){r.remove();rippleQueue=rippleQueue.filter(function(x){return x!==ref})},480);rippleQueue.push(ref)}
    function goScene(next,source){if(valid.scene.indexOf(next)<0||next===state.scene)return;if(source)source.classList.add('is-pressed');if(source&&source.hasAttribute('data-ripple'))triggerRipple(source);setTimeout(function(){selects.scene.value=next;commit('push')},90)}
    function renderSceneNav(){var nav=content.querySelector('.bottom-nav');if(!nav)return;nav.innerHTML='';sceneNav.forEach(function(item){var button=document.createElement('button');button.type='button';button.dataset.sceneTarget=item[0];button.textContent=item[1];if(item[0]===state.scene)button.setAttribute('aria-current','page');nav.appendChild(button)})}
    function renderScene(){var s=scenes[state.scene];root.dataset.scene=state.scene;title.textContent=s.title;content.innerHTML=s.html;if(state.scene==='home')content.querySelector('.home-summary .cta').dataset.sceneTarget='market';if(state.scene==='profile'){var targets=['home','market','workspace','listing'];content.querySelectorAll('.profile-list button').forEach(function(button,index){button.dataset.sceneTarget=targets[index]})}renderSceneNav();content.querySelectorAll('[data-ripple]:not([data-scene-target])').forEach(function(btn){btn.addEventListener('click',function(){triggerRipple(btn)})});content.querySelectorAll('[data-scene-target]').forEach(function(btn){btn.addEventListener('click',function(){goScene(btn.dataset.sceneTarget,btn)})})}
    function imgFor(letter,emotion){return 'assets/kai-mascots/'+letter+'-'+emotion+'-v2.png'}
    function setImg(id,letter,emotion){var img=document.getElementById(id);img.src=imgFor(letter,emotion);img.dataset.fallback=letter.toUpperCase();img.onerror=function(){this.onerror=null;this.removeAttribute('src');this.alt=this.dataset.fallback;this.style.border='2px solid var(--line)';this.style.padding='26px';this.setAttribute('aria-label',this.dataset.fallback)}}
    function syncBackgroundInert(active){backgroundNodes.forEach(function(node){if(!node)return;if(active){node.setAttribute('inert','');node.setAttribute('aria-hidden','true')}else{node.removeAttribute('inert');node.removeAttribute('aria-hidden')}})}
    function renderNetwork(){var active=state.network!=='none';root.dataset.network=state.network;overlay.dataset.networkOverlay=active?'open':'closed';overlay.classList.toggle('is-open',active);overlay.setAttribute('aria-hidden',String(!active));syncBackgroundInert(active);if(!active)return;var c=networkCopy[state.network],m=emotions[state.network];stage.dataset.network=state.network;stage.classList.toggle('is-sequence',state.network==='sequence');stage.setAttribute('aria-label','K、A、I '+c.tag);setImg('mascot-k','k',m[0]);setImg('mascot-a','a',m[1]);setImg('mascot-i','i',m[2]);document.getElementById('network-tag').textContent=c.tag;document.getElementById('network-title').textContent=c.title;document.getElementById('network-desc').textContent=c.desc;document.getElementById('network-line').textContent=c.line;var actions=document.getElementById('network-actions');actions.innerHTML='';c.buttons.forEach(function(label,index){var b=document.createElement('button');b.type='button';b.className='cta '+(index?'ghost':'');b.textContent=label;b.addEventListener('click',function(){if(label==='重新连接'||label==='再试一次'){selects.network.value='reconnecting';commit('push');timers.push(setTimeout(function(){selects.network.value='restored';commit('replace')},520))}else{selects.network.value='none';commit('push')}});actions.appendChild(b)});actions.hidden=!c.buttons.length;if(active){previousFocus=document.activeElement;setTimeout(function(){closeNetwork.focus()},0)}}
    function renderInfo(){var m=particleModes[state.particles], fit=m.fit.indexOf(state.scene)>-1?'推荐':m.try.indexOf(state.scene)>-1?'可试':'不适用';if(state.network!=='none')fit='网络状态已暂停环境粒子';detail.innerHTML='<dt>表达什么</dt><dd>'+m.meaning+'</dd><dt>适合页面</dt><dd>'+m.good+'</dd><dt>不应使用的位置</dt><dd>'+m.bad+'</dd>';fitStatus.textContent=fit}
    function apply(raw,historyMode){state=normalize(raw);state.effective=state.network==='none'?state.particles:'off';root.dataset.particleSelection=state.particles;root.dataset.particles=state.effective;root.dataset.motion=state.motion;phone.dataset.size=state.size;applyTheme(state);renderScene();renderParticles();renderNetwork();renderInfo();caption.textContent=state.network==='none'?(particleModes[state.particles].name+' · '+(particleModes[state.particles].fit.indexOf(state.scene)>-1?'适合当前场景':particleModes[state.particles].try.indexOf(state.scene)>-1?'可用于对比':'不适合当前场景')):'网络状态已开启，环境粒子暂时关闭';if(historyMode){var u=new URL(location.href);Object.keys(state).forEach(function(k){if(k!=='effective')u.searchParams.set(k,state[k])});history[historyMode+'State'](null,'',u)}}
    function commit(historyMode){apply(current(),historyMode||'push')}
    function fromUrl(){var u=new URL(location.href),raw={};Object.keys(selects).forEach(function(k){raw[k]=u.searchParams.get(k)||defaults[k];selects[k].value=valid[k].indexOf(raw[k])>-1?raw[k]:defaults[k]});apply(raw,false)}
    Object.keys(selects).forEach(function(k){selects[k].addEventListener('change',function(){commit('push')})});closeNetwork.addEventListener('click',function(){selects.network.value='none';commit('push');if(previousFocus&&previousFocus.focus)previousFocus.focus()});
    overlay.addEventListener('keydown',function(ev){if(ev.key==='Escape'){ev.preventDefault();closeNetwork.click()}if(ev.key==='Tab'){var f=Array.prototype.slice.call(overlay.querySelectorAll('button:not([hidden])'));if(!f.length)return;var first=f[0],last=f[f.length-1];if(ev.shiftKey&&document.activeElement===first){ev.preventDefault();last.focus()}else if(!ev.shiftKey&&document.activeElement===last){ev.preventDefault();first.focus()}}});
    window.addEventListener('popstate',fromUrl);document.addEventListener('visibilitychange',function(){root.classList.toggle('is-hidden',document.hidden)});if(window.matchMedia){var mq=matchMedia('(prefers-color-scheme: dark)');var systemChange=function(){if(selects.theme.value==='system')commit(false)};if(mq.addEventListener)mq.addEventListener('change',systemChange);else mq.addListener(systemChange)}
    window.__kaiPreview={getState:function(){return Object.assign({},state)},getParticleStats:function(){var nodes=Array.prototype.slice.call(ambient.querySelectorAll('.particle'));return {mode:state.effective,count:nodes.length,items:nodes.map(function(n){var r=n.getBoundingClientRect(),style=getComputedStyle(n);return {mode:n.dataset.particleMode,index:n.dataset.particleIndex,width:r.width,height:r.height,animation:style.animationName,visible:style.display!=='none'&&style.visibility!=='hidden'}})}},getRoleAssets:function(){return ['k','a','i'].map(function(letter){var img=document.getElementById('mascot-'+letter);return {letter:letter,src:img.getAttribute('src')||'',alt:img.alt}})}};
    fromUrl();
  })();
  </script>
