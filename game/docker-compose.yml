services:
  doujoy-server:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DOUJOY_CORS_ORIGIN: "${DOUJOY_CORS_ORIGIN:-http://localhost:8081}"
      DOUJOY_TURN_TIMEOUT_MS: "${DOUJOY_TURN_TIMEOUT_MS:-45000}"
      DOUJOY_BOT_THINK_MIN_MS: "${DOUJOY_BOT_THINK_MIN_MS:-1200}"
      DOUJOY_BOT_THINK_MAX_MS: "${DOUJOY_BOT_THINK_MAX_MS:-2200}"
      DOUJOY_BACKUP_COUNT: "${DOUJOY_BACKUP_COUNT:-3}"
      DOUJOY_WAIT_TIMEOUT_MAX_MS: "${DOUJOY_WAIT_TIMEOUT_MAX_MS:-25000}"
      DOUJOY_CLOUDPAY_MODE: "${DOUJOY_CLOUDPAY_MODE:-disabled}"
      DOUJOY_CLOUDPAY_SANDBOX_DATA_PATH: "${DOUJOY_CLOUDPAY_SANDBOX_DATA_PATH:-/data/cloudpay-sandbox-orders.json}"
    ports:
      - "${DOUJOY_BIND_IP:-127.0.0.1}:${DOUJOY_PORT:-4310}:4310"
    volumes:
      - doujoy-data:/data
    restart: unless-stopped
    stop_grace_period: 20s
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m

  doujoy-web:
    build:
      context: .
      dockerfile: web/Dockerfile
    environment:
      DOUJOY_WEB_HOST: "0.0.0.0"
      DOUJOY_WEB_PORT: "8081"
      DOUJOY_WEB_UPSTREAM: "http://doujoy-server:4310"
    ports:
      - "${DOUJOY_WEB_BIND_IP:-127.0.0.1}:${DOUJOY_WEB_PORT:-8081}:8081"
    depends_on:
      doujoy-server:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 128m

volumes:
  doujoy-data:
